<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: flex;
            flex-direction: row;
            gap: 10px;
            flex-wrap: wrap;
        }
        .card {
            display: flex;
            flex-direction: column;
            gap: 5px;
            border-radius: 10px;
            justify-content: center;
            align-items: center;
            border: 1px solid lightblue;
            background-color: aliceblue;
            width: 30%;
            min-height: 100px;
        }
        img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-top: 10px;
        }
        h2 {
            font-weight: bolder;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }
        p {
            color: red;
            font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
        }
        button {
            height: 40px;
            width: 80px;
            background-color: green;
            color: white;
            border-radius: 8px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <img src="coup1.jpg" alt="">
            <h2>John Doe</h2>
            <p>Frontend Developer</p>
            <button>Click Me</button>
        </div>
        <div class="card">
            <img src="coup2.jpg" alt="">
            <h2>James Smith</h2>
            <p>UI/UX Designer</p>
            <button>Click Me</button>
        </div>
        <div class="card">
            <img src="coup3.jpg" alt="">
            <h2>Micheal Lee</h2>
            <p>Backend Developer</p>
            <button>Click Me</button>
        </div>
        <div class="card">
            <img src="copu4.jpg" alt="">
            <h2>Adams Brad</h2>
            <p>UI/UX Designer</p>
            <button>Click Me</button>
        </div>
        <div class="card">
            <img src="coup5.jpg" alt="">
            <h2>George Miller</h2>
            <p>Backend Programmer</p>
            <button>Click Me</button>
        </div>
        <div class="card">
            <img src="coup6.jpg" alt="">
            <h2>Sarah Gina</h2>
            <p>Data Analyst</p>
            <button>Click Me</button>
        </div>
    </div>
</body>
</html>
